spring:
  application:
    name: order-service
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_URL:localhost:5443/order_service}
    password: ${DB_PASSWORD:123}
    username: ${DB_USERNAME:postgres}
  jpa:
    hibernate:
      ddl-auto: validate

app:
  base-url: ${BASE_URL:}


server:
  port: 8087




